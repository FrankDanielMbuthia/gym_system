<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
</head>
<body>

<h2>Admin Reports</h2>

<button onclick="getAttendance()">Daily Attendance</button>
<button onclick="getRevenue()">Revenue</button>

<pre id="output"></pre>

<script>
const token = localStorage.getItem("access");

async function getAttendance() {
    const res = await fetch("http://127.0.0.1:8000/reports/attendance/daily/", {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    const data = await res.json();
    document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}

async function getRevenue() {
    const res = await fetch("http://127.0.0.1:8000/reports/revenue/", {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    const data = await res.json();
    document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
